
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7fc">
  <meta name="description" content="Sign in or create your Kivo seller account.">
  <title>Sign in | Kivo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f8f7fc;
      color: #201b2d;
      font-family: Inter, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #fff;
      border: 1px solid #e9e5f0;
      border-radius: 20px;
      box-shadow: 0 12px 40px #2610440a;
    }

    .brand {
      color: #6d28d9;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
    }

    h1 { margin: 25px 0 8px; font-size: 28px; }
    p { color: #777381; line-height: 1.6; font-size: 14px; }

    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd8e8;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: .55; cursor: wait; }
    .primary { background: #6d28d9; color: white; }
    .secondary { background: #f2eff8; color: #211a2b; }

    .divider {
      margin: 18px 0;
      text-align: center;
      color: #898392;
      font-size: 12px;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.show { display: block; }
    #message.error { background: #fff0ee; color: #a1261c; }
    #message.success { background: #eefbf3; color: #176c42; }

    .links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      font-size: 13px;
    }

    a { color: #6d28d9; }
    .note { margin-top: 24px; text-align: center; font-size: 12px; }
  </style>
</head>

<body>
  <main class="card">
    <a class="brand" href="/">Kivo</a>

    <h1 id="heading">Welcome back</h1>
    <p id="description">Sign in to manage your business on Kivo.</p>

    <form id="auth-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password"
        autocomplete="current-password" minlength="6" required>

      <button class="primary" id="submit-button" type="submit">
        Sign in
      </button>
    </form>

    <button class="secondary" id="google-button" type="button">
      Continue with Google
    </button>

    <div class="divider">OR</div>

    <button class="secondary" id="mode-button" type="button">
      Create a new account
    </button>

    <button class="secondary" id="reset-button" type="button">
      Forgot password?
    </button>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links">
      <a href="/">Back to homepage</a>
      <a href="/dashboard/">Dashboard</a>
    </div>

    <p class="note">Your business, better connected.</p>
  </main>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL =
        "https://uhgnuuuvjkzfipynnhzk.supabase.co";

      const SUPABASE_PUBLIC_KEY =
        "sb_publishable_kLNzMwHsHzZj9q8KO4P6pw_u1CGVQTy";

      const STORAGE_KEY = "kivo-auth";
      const LOGIN_URL = location.origin + "/auth/login.html";
      const DASHBOARD_URL = location.origin + "/dashboard/";

      const message = document.getElementById("message");
      const form = document.getElementById("auth-form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submitButton = document.getElementById("submit-button");
      const googleButton = document.getElementById("google-button");
      const modeButton = document.getElementById("mode-button");
      const resetButton = document.getElementById("reset-button");

      let isSignup = false;
      let resetMode = false;
      let busy = false;

      if (!window.supabase?.createClient) {
        message.textContent =
          "Kivo could not load its authentication service. Refresh and try again.";
        message.className = "show error";
        return;
      }

      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY,
        {
          auth: {
            flowType: "pkce",
            storageKey: STORAGE_KEY,
            storage: window.localStorage,
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      function notify(text, type = "error") {
        message.textContent = text;
        message.className = "show " + type;
      }

      function setBusy(value) {
        busy = value;
        submitButton.disabled = value;
        googleButton.disabled = value;
        modeButton.disabled = value;
        resetButton.disabled = value;
      }

      function showNormalLogin() {
        resetMode = false;
        isSignup = false;

        document.getElementById("heading").textContent = "Welcome back";
        document.getElementById("description").textContent =
          "Sign in to manage your business on Kivo.";

        submitButton.textContent = "Sign in";
        modeButton.textContent = "Create a new account";
        passwordInput.autocomplete = "current-password";
        passwordInput.value = "";
      }

      async function verifyAndContinue(session) {
        if (!session) return;

        notify("Checking your Kivo account...", "success");

        try {
          const response = await fetch("/api/me", {
            method: "GET",
            headers: {
              Authorization: "Bearer " + session.access_token,
              Accept: "application/json"
            },
            cache: "no-store"
          });

          if (response.status === 401 || response.status === 403) {
            throw new Error(
              "Your session could not be verified. Please sign in again."
            );
          }

          if (!response.ok) {
            throw new Error(
              "Kivo's server could not verify your account. Please try again."
            );
          }

          location.replace(DASHBOARD_URL);
        } catch (error) {
          notify(error.message || "Account verification failed.");
        }
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;

        setBusy(true);

        try {
          const password = passwordInput.value;

          if (resetMode) {
            const { error } = await client.auth.updateUser({ password });
            if (error) throw error;

            showNormalLogin();
            notify(
              "Your password has been updated. Sign in with your new password.",
              "success"
            );
            history.replaceState({}, document.title, LOGIN_URL);
            return;
          }

          const email = emailInput.value.trim();

          if (isSignup) {
            const { data, error } = await client.auth.signUp({
              email,
              password,
              options: { emailRedirectTo: LOGIN_URL }
            });

            if (error) throw error;

            if (!data.session) {
              notify(
                "Account created. Check your email for a confirmation link, then sign in.",
                "success"
              );
              return;
            }

            await verifyAndContinue(data.session);
            return;
          }

          const { data, error } =
            await client.auth.signInWithPassword({ email, password });

          if (error) throw error;

          await verifyAndContinue(data.session);
        } catch (error) {
          notify(error.message || "Authentication failed.");
        } finally {
          setBusy(false);
        }
      });

      googleButton.addEventListener("click", async () => {
        if (busy) return;

        setBusy(true);
        notify("Connecting to Google...", "success");

        try {
          const { error } = await client.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: DASHBOARD_URL }
          });

          if (error) throw error;
        } catch (error) {
          notify(error.message || "Google sign-in could not start.");
          setBusy(false);
        }
      });

      modeButton.addEventListener("click", () => {
        if (busy || resetMode) return;

        isSignup = !isSignup;

        document.getElementById("heading").textContent =
          isSignup ? "Create your account" : "Welcome back";

        document.getElementById("description").textContent =
          isSignup
            ? "Create your Kivo seller account."
            : "Sign in to manage your business on Kivo.";

        submitButton.textContent =
          isSignup ? "Create account" : "Sign in";

        modeButton.textContent =
          isSignup ? "I already have an account" : "Create a new account";

        passwordInput.autocomplete =
          isSignup ? "new-password" : "current-password";

        notify("", "success");
        message.className = "";
      });

      resetButton.addEventListener("click", async () => {
        if (busy) return;

        if (resetMode) {
          showNormalLogin();
          message.className = "";
          return;
        }

        const email = emailInput.value.trim();

        if (!email) {
          notify("Enter your email address first.");
          emailInput.focus();
          return;
        }

        setBusy(true);

        try {
          const { error } = await client.auth.resetPasswordForEmail(email, {
            redirectTo: LOGIN_URL + "?reset=1"
          });

          if (error) throw error;

          notify(
            "If an account exists for that email, a password-reset link will be sent.",
            "success"
          );
        } catch (error) {
          notify(error.message || "Could not request a password reset.");
        } finally {
          setBusy(false);
        }
      });

      async function initialize() {
        const url = new URL(location.href);
        const oauthError = url.searchParams.get("error_description");

        if (oauthError) {
          notify("Sign-in error: " + oauthError);
          return;
        }

        if (url.searchParams.get("reset") === "1") {
          resetMode = true;
          document.getElementById("heading").textContent =
            "Choose a new password";
          document.getElementById("description").textContent =
            "Enter your new password below.";
          submitButton.textContent = "Update password";
          modeButton.textContent = "Cancel password reset";
          resetButton.textContent = "Cancel password reset";
          passwordInput.autocomplete = "new-password";
          passwordInput.value = "";
          passwordInput.minLength = 6;
          passwordInput.focus();
          return;
        }

        const { data, error } = await client.auth.getSession();

        if (error) {
          notify("Could not read your session. Please refresh and try again.");
          return;
        }

        if (data.session) {
          await verifyAndContinue(data.session);
        }
      }

      initialize().catch(error => {
        notify(error.message || "Kivo could not initialize authentication.");
      });
    })();
  </script>
</body>
</html>
