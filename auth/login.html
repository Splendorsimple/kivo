
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7fc">
  <title>Sign in to Kivo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f7fc;color:#191620;font-family:Inter,Arial,sans-serif}
    .card{width:100%;max-width:420px;padding:32px;background:#fff;border:1px solid #e9e5f0;border-radius:20px;box-shadow:0 12px 40px #2610440a}
    .brand{font-size:28px;font-weight:800;letter-spacing:-1px;color:#6d28d9}
    h1{margin:25px 0 8px;font-size:28px;letter-spacing:-1px}
    p{color:#777381;line-height:1.6;font-size:14px}
    label{display:block;margin:18px 0 7px;font-size:13px;font-weight:650}
    input{width:100%;padding:13px;border:1px solid #ddd8e8;border-radius:10px;font-size:15px}
    button{width:100%;padding:13px;margin-top:14px;border:0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .primary{background:#6d28d9;color:#fff}
    .secondary{background:#f2eff8;color:#211a2b}
    .divider{text-align:center;margin:18px 0;color:#898392;font-size:12px}
    #message{display:none;margin-top:16px;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
    #message.show{display:block}
    #message.error{background:#fff0ee;color:#a1261c}
    #message.success{background:#eefbf3;color:#176c42}
    .links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;font-size:13px}
    a{color:#6d28d9;text-decoration:none}
    .note{margin-top:24px;text-align:center;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/">Kivo</a>
    <h1 id="heading">Welcome back</h1>
    <p id="description">Sign in to manage your business on Kivo.</p>

    <form id="auth-form">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button class="primary" id="submit-button" type="submit">Sign in</button>
    </form>

    <button class="secondary" id="google-button" type="button">
      Continue with Google
    </button>

    <div class="divider">OR</div>

    <button class="secondary" id="mode-button" type="button">
      Create a new account
    </button>

    <button class="secondary" id="reset-button" type="button">
      Forgot password?
    </button>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="links">
      <a href="/">Back to homepage</a>
      <a href="/dashboard/">Dashboard</a>
    </div>
    <p class="note">Your business, better connected.</p>
  </main>

  <script>
    (() => {
      "use strict";

      const SUPABASE_URL = "https://uhgnuuuvjkzfipynnhzk.supabase.co";
      const SUPABASE_PUBLIC_KEY = "sb_publishable_kLNzMwHsHzZj9q8KO4P6pw_u1CGVQTy";

      // MUST match the dashboard configuration exactly.
      const STORAGE_KEY = "kivo-auth";

      const DASHBOARD_URL = window.location.origin + "/dashboard/";
      const LOGIN_URL = window.location.origin + "/auth/login.html";

      const message = document.getElementById("message");
      const form = document.getElementById("auth-form");
      const submitButton = document.getElementById("submit-button");
      const modeButton = document.getElementById("mode-button");
      let isSignup = false;
      let busy = false;

      const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY,
        {
          auth: {
            flowType: "pkce",
            storageKey: STORAGE_KEY,
            storage: window.localStorage,
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

      function notify(text, type = "error") {
        message.textContent = text;
        message.className = "show " + type;
      }

      function setBusy(value) {
        busy = value;
        submitButton.disabled = value;
        document.getElementById("google-button").disabled = value;
        modeButton.disabled = value;
        document.getElementById("reset-button").disabled = value;
      }

      async function verifyAndContinue(session) {
        if (!session) return;

        notify("Checking your Kivo account...", "success");

        try {
          const response = await fetch("/api/me", {
            headers: {
              Authorization: "Bearer " + session.access_token,
              Accept: "application/json"
            },
            cache: "no-store"
          });

          if (!response.ok) {
            const body = await response.text();
            throw new Error("Account verification failed (" + response.status + "). " + body.slice(0, 250));
          }

          window.location.replace(DASHBOARD_URL);
        } catch (error) {
          notify(
            (error.message || "Could not verify your account.") +
            " Your sign-in session has been retained. Please try again.",
            "error"
          );
        }
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;

        setBusy(true);
        notify(isSignup ? "Creating your account..." : "Signing you in...", "success");

        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;

          const result = isSignup
            ? await supabase.auth.signUp({
                email,
                password,
                options: { emailRedirectTo: LOGIN_URL }
              })
            : await supabase.auth.signInWithPassword({ email, password });

          if (result.error) throw result.error;

          if (isSignup && !result.data.session) {
            notify("Account created. Check your email for the confirmation link, then sign in.", "success");
            return;
          }

          if (result.data.session) {
            await verifyAndContinue(result.data.session);
          } else {
            notify("No active session was returned. Please try signing in again.");
          }
        } catch (error) {
          notify(error.message || "Authentication failed.");
        } finally {
          setBusy(false);
        }
      });

      document.getElementById("google-button").addEventListener("click", async () => {
        if (busy) return;

        setBusy(true);
        notify("Connecting to Google...", "success");

        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: "google",
            options: { redirectTo: DASHBOARD_URL }
          });

          if (error) throw error;
        } catch (error) {
          notify(error.message || "Google sign-in could not start.");
          setBusy(false);
        }
      });

      modeButton.addEventListener("click", () => {
        isSignup = !isSignup;
        document.getElementById("heading").textContent =
          isSignup ? "Create your account" : "Welcome back";
        document.getElementById("description").textContent =
          isSignup ? "Create your Kivo seller account." : "Sign in to manage your business on Kivo.";
        submitButton.textContent = isSignup ? "Create account" : "Sign in";
        modeButton.textContent = isSignup ? "I already have an account" : "Create a new account";
        document.getElementById("password").autocomplete =
          isSignup ? "new-password" : "current-password";
        notify("", "success");
      });

      document.getElementById("reset-button").addEventListener("click", async () => {
        if (busy) return;

        const email = document.getElementById("email").value.trim();
        if (!email) {
          notify("Enter your email address above first.");
          document.getElementById("email").focus();
          return;
        }

        setBusy(true);

        try {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: LOGIN_URL + "?reset=1"
          });

          if (error) throw error;
          notify("If an account exists for that email, a password-reset link will be sent.", "success");
        } catch (error) {
          notify(error.message || "Could not request a password reset.");
        } finally {
          setBusy(false);
        }
      });

      async function initialize() {
        const url = new URL(window.location.href);

        if (url.searchParams.get("error_description")) {
          notify("Sign-in error: " + url.searchParams.get("error_description"));
          return;
        }

        if (url.searchParams.get("reset") === "1") {
          document.getElementById("heading").textContent = "Choose a new password";
          document.getElementById("description").textContent = "Enter your new password below.";
          submitButton.textContent = "Update password";

          form.addEventListener("submit", async event => {
            if (document.getElementById("heading").textContent !== "Choose a new password") return;
            event.preventDefault();
            if (busy) return;

            setBusy(true);
            try {
              const password = document.getElementById("password").value;
              const { error } = await supabase.auth.updateUser({ password });
              if (error) throw error;
              notify("Password updated. You can now sign in.", "success");
              window.history.replaceState({}, document.title, LOGIN_URL);
              document.getElementById("heading").textContent = "Welcome back";
              submitButton.textContent = "Sign in";
            } catch (error) {
              notify(error.message || "Could not update your password.");
            } finally {
              setBusy(false);
            }
          });
          return;
        }

        const { data, error } = await supabase.auth.getSession();

        if (error) {
          notify("Could not read your session: " + error.message);
          return;
        }

        if (data.session) {
          await verifyAndContinue(data.session);
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
